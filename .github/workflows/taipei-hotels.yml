name: Taipei FHR/THC price tracker

on:
  schedule:
    - cron: "17 0 * * *" # daily, ~08:17 Taiwan time
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: taipei-hotels
  cancel-in-progress: false

jobs:
  track:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch prices, diff and email
        env:
          WINDOW_START: "2026-11-20"
          WINDOW_END: "2027-01-18"
          CITY: Taipei
          CURRENCY: USD
          CHANGE_PCT: "5"
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
        run: python taipei_hotels/track.py
      - name: Commit snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add taipei_hotels/data/latest.json
          git diff --cached --quiet || git commit -m "Update Taipei hotel price snapshot"
          git push
